name: MenQ Design Platform Audit

on:
  push:
    branches: [main, menq-design-platform-adoption-v1, menq-webpage-post-merge-closure]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-inventory:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build repository inventory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit-artifact/source
          git ls-files -z | while IFS= read -r -d '' file; do
            case "$file" in
              .env|.env.*|*.pem|*.key|*.p12|*.pfx) continue ;;
            esac
            mkdir -p "audit-artifact/source/$(dirname "$file")"
            cp "$file" "audit-artifact/source/$file"
          done
          git ls-files > audit-artifact/TRACKED_FILES.txt
          git ls-files '*.md' '*.MD' > audit-artifact/MARKDOWN_FILES.txt
          git ls-files '*.ts' '*.tsx' '*.js' '*.jsx' '*.css' '*.scss' '*.json' '*.prisma' > audit-artifact/SOURCE_FILES.txt
          git rev-parse HEAD > audit-artifact/HEAD_SHA.txt
          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          root = Path('.')
          rows = []
          for path in sorted(root.glob('**/*')):
              if not path.is_file() or '.git' in path.parts or 'audit-artifact' in path.parts:
                  continue
              rel = path.as_posix()
              data = path.read_bytes()
              rows.append({'path': rel, 'bytes': len(data), 'sha256': hashlib.sha256(data).hexdigest()})
          Path('audit-artifact/FILE_MANIFEST.json').write_text(json.dumps({'files': rows}, indent=2), encoding='utf-8')
          PY

      - name: Validate MenQ Webpage documentation
        run: python scripts/validate_webpage_documentation.py

      - name: Validate MenQ Design Platform adoption
        run: python scripts/validate_menq_design_adoption.py

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test -- --run

      - name: Build
        run: npm run build

      - name: Install Chromium for evidence checks
        run: npx playwright install --with-deps chromium

      - name: Verify brand token consumption (pin + token parity)
        env:
          MENQ_EVIDENCE_DIR: audit-artifact/evidence
        run: |
          mkdir -p "$MENQ_EVIDENCE_DIR"
          node scripts/verify_brand_tokens.mjs

      - name: Runtime consumer evidence (production server)
        env:
          MENQ_EVIDENCE_DIR: audit-artifact/evidence
          MENQ_BASE_URL: http://localhost:3100
          NEXT_PUBLIC_APP_URL: http://localhost:3100
        run: |
          set -euo pipefail
          npm start -- -p 3100 > audit-artifact/evidence/server.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS -o /dev/null http://localhost:3100/hy && break; sleep 2; done
          node scripts/e2e_consumer_smoke.mjs || {
            tail -n 20 audit-artifact/evidence/server.log | sed 's/^/::warning title=server.log::/'
            exit 1
          }

      - name: Upload audit source and evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: menq-webpage-audit-source
          path: audit-artifact
          if-no-files-found: error
          retention-days: 7
